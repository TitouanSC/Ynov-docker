name: wp-infra

services:
  nginx:
    image: nginx:1.27.4-alpine
    container_name: tp-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - net_edge
      - net_front
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  wordpress:
    image: wordpress:6.7.2-apache
    container_name: tp-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: ${WP_DB_USER:-wpuser}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      TZ: ${TZ:-Europe/Paris}
    secrets:
      - db_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - net_front
      - net_data
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/wp-login.php >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  mariadb:
    image: mariadb:11.4.5
    container_name: tp-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: ${WP_DB_NAME:-wordpress}
      MARIADB_USER: ${WP_DB_USER:-wpuser}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      TZ: ${TZ:-Europe/Paris}
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - net_data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  phpmyadmin:
    profiles: ["admin"]
    image: phpmyadmin:5.2.2-apache
    container_name: tp-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${WP_DB_USER:-wpuser}
    networks:
      - net_data
    ports:
      - "${ADMINER_PORT:-8081}:80"
    depends_on:
      mariadb:
        condition: service_healthy

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db_data:
    name: wp_infra_db_data
  wp_data:
    name: wp_infra_wp_data

networks:
  net_edge:
    name: wp_net_edge
  net_front:
    name: wp_net_front
  net_data:
    name: wp_net_data
