name: shop-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/shopapi
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/shop-worker

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reponse/tp09-cicd-deploiement/shop
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: reponse/tp09-cicd-deploiement/shop/apps/shopapi/Dockerfile
          failure-threshold: warning
      - name: compose config
        run: docker compose config >/dev/null
      - name: build api test stage
        run: docker build --target test -t shopapi:test ./apps/shopapi || docker build -t shopapi:test ./apps/shopapi
      - name: build images (no push)
        run: |
          docker build -t shopapi:ci ./apps/shopapi
          docker build -t shop-worker:ci ./apps/shop-worker

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [shopapi, shop-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: build push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: reponse/tp09-cicd-deploiement/shop/apps/${{ matrix.app == 'shopapi' && 'shopapi' || 'shop-worker' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: cosign keyless
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}@${{ steps.meta.outputs.digest }}
        env:
          COSIGN_YES: "true"

  deploy-preprod:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - name: deploy via context
        run: |
          echo "DOCKER_CONTEXT=preprod docker compose -f compose.yml -f compose.prod.yml up -d --wait"
          echo "(configurer docker context ssh://deploy@preprod + secrets serveur)"

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: verify signature then rolling update
        run: |
          echo "cosign verify ... && ./deploy/rolling-update.sh"
