# Durcissement GestStock — usage :
#   docker compose -f compose.yml -f compose.hardened.yml up -d --wait
#   ./scripts/audit.sh

x-security: &security
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 256

services:
  traefik:
    <<: *security
    user: "65532"
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: "0.50"

  app:
    <<: *security
    # Apache a besoin de binder :80 + drop workers → www-data
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    mem_limit: 256m
    cpus: "0.75"

  db:
    <<: *security
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/mysqld
    mem_limit: 512m
    cpus: "1.0"
