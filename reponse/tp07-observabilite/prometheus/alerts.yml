groups:
  - name: shop
    rules:
      - alert: ApiDown
        expr: up{job="shop-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "API Shop down"

      - alert: High5xxRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
            /
          sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "> 5% de réponses 5xx"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "p95 latence > 500ms"

      - alert: ContainerRestarting
        expr: increase(container_start_time_seconds[10m]) > 0 and changes(container_start_time_seconds[10m]) > 2
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Conteneur qui redémarre souvent"

      - alert: ContainerMemoryHigh
        expr: |
          container_memory_working_set_bytes{name!=""}
            / container_spec_memory_limit_bytes{name!=""} > 0.9
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Mémoire > 90% de la limite"
