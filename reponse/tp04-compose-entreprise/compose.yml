name: shop

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      # Labels Docker conservés sur les services ; provider Docker désactivé ici car
      # Docker Desktop (API Engine récente) renvoie une erreur vide à Traefik 3.1.
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --ping=true
    ports:
      - "80:80"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [front]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    logging: *default-logging

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [back]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    networks: [back]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    logging: *default-logging

  api:
    build: ./apps/shopapi
    image: shopapi:local
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      LOG_LEVEL: info
      APP_VERSION: "1.4.2"
    secrets: [db_password]
    networks: [front, back]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=shop_front
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
    logging: *default-logging

  worker:
    build: ./apps/shop-worker
    image: shop-worker:local
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      METRICS_PORT: "9100"
      LOG_LEVEL: INFO
    secrets: [db_password]
    networks: [back]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/', timeout=2)"]
    logging: *default-logging

  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    restart: unless-stopped
    networks: [front, back]
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=shop_front
      - traefik.http.routers.adminer.rule=Host(`adminer.localhost`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.services.adminer.loadbalancer.server.port=8080
    logging: *default-logging

  migrate:
    image: postgres:16.4-alpine
    profiles: [ops]
    secrets: [db_password]
    volumes:
      - ./db/migrations:/migrations:ro
    networks: [back]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        PASS=$$(cat /run/secrets/db_password)
        FILE="/migrations/$${MIGRATION:?MIGRATION required}"
        echo "Applying $$FILE"
        PGPASSWORD="$$PASS" psql -h db -U shop -d shop -f "$$FILE"

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  front:
    name: shop_front
  back:
    name: shop_back
    internal: true

volumes:
  pgdata:
  redisdata:
