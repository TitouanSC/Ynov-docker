# Surcharge durcie de la stack TP04
# Usage (depuis reponse/tp04-compose-entreprise) :
#   docker compose -f compose.yml -f ../tp08-hardening/compose.hardened.yml up -d --wait

x-security: &security
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 256

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    <<: *security
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      socket:
        aliases: [dockerproxy]
    mem_limit: 64m
    cpus: "0.20"
    restart: unless-stopped

  traefik:
    <<: *security
    # Menace : socket Docker = root hôte → remplacée par proxy RO (pas de sock montée)
    # On conserve le fichier dynamic.yml (provider fichier du TP04).
    user: "65532"
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOCKER_HOST: tcp://dockerproxy:2375
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [front, socket]
    mem_limit: 128m
    cpus: "0.50"

  db:
    <<: *security
    # Postgres init nécessite ces caps (essai/erreur + logs)
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
      - /run
    mem_limit: 512m
    cpus: "1.0"

  redis:
    <<: *security
    user: "999"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: "0.50"

  api:
    <<: *security
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: "0.50"

  worker:
    <<: *security
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: "0.50"

networks:
  socket:
    name: shop_socket
    internal: true
